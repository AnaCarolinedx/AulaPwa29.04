<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="refresh" content="0; url=site.html">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007bff">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body>
<script>
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;

  const installBtn = document.getElementById('installBtn');
  installBtn.style.display = 'block';

  installBtn.addEventListener('click', () => {
    installBtn.style.display = 'none';
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      console.log('Resultado da instalação: ', choiceResult.outcome);
      deferredPrompt = null;
    });
  });
});
</script>

<button id="installBtn" style="display:none; position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
  Instalar App
</button>
</body>
</html>
