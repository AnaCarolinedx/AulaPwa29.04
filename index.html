<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007bff">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">


  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .login-container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 300px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #4facfe;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #3a8edb;
    }

    .error {
      color: red;
      margin-top: 10px;
      display: none;
    }

    .success {
      color: green;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Login</h2>
  <input type="text" id="username" placeholder="Usuário">
  <input type="password" id="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>

  <p class="error" id="errorMsg">Usuário ou senha incorretos</p>
  <p class="success" id="successMsg">Login realizado com sucesso!</p>
</div>

<script>
  function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");

    // Usuário e senha fixos (exemplo)
    if (user === "admin" && pass === "1234") {
      errorMsg.style.display = "none";
      successMsg.style.display = "block";
    } else {
      successMsg.style.display = "none";
      errorMsg.style.display = "block";
    }
  }
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker registrado:', reg.scope))
      .catch(err => console.log('Falha ao registrar SW:', err));
  });
}
</script>

<button id="installBtn" style="display:none; position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
  Instalar App
</button>

<script>
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;

  const installBtn = document.getElementById('installBtn');
  installBtn.style.display = 'block';

  installBtn.addEventListener('click', () => {
    installBtn.style.display = 'none';
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      console.log('Resultado da instalação:', choiceResult.outcome);
      deferredPrompt = null;
    });
  });
});
</script>

</body>
</html>
